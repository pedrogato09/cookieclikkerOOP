<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream Clicker</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <h1>Cream Clicker</h1>
    <p>Cream: <span id="creamCount"></span></p>
    <br>
    <img src="thecream.png" width="400px" id="cream"></img>

    <div class="units">
        <h2>Productie Eenheden</h2>
        <p>Cursor: <span id="cursorUnits"></span></p>
        <p>Grandma: <span id="grandmaUnits"></span></p>
        <p>Mine: <span id="mineUnits"></span></p>
        <p>Factory: <span id="factoryUnits"></span></p>
    </div>

    <div class="store">
        <h2>Winkel</h2>
        <button id="cursorStore">Cursor</button>
        <p>Price: <span id="cursorCost"></span> creams</p>
        <button id="grandmaStore">Grandma</button>
        <p>Price: <span id="grandmaCost"></span> creams</p>
        <button id="mineStore">Mine</button>
        <p>Price: <span id="mineCost"></span> creams</p>
        <button id="factoryStore">Factory</button>
        <p>Price: <span id="factoryCost"></span> creams</p>
    </div>

    <div class="upgrades">
        <h2>Upgrades</h2>
        <button id="cursorUpgrade">Cursor Upgrade</button>
        <p>Price: <span id="cursorUpgradeCost"></span> creams</p>
        <button id="grandmaUpgrade">Grandma Upgrade</button>
        <p>Price: <span id="grandmaUpgradeCost"></span> creams</p>
        <button id="mineUpgrade">Mine Upgrade</button>
        <p>Price: <span id="mineUpgradeCost"></span> creams</p>
        <button id="factoryUpgrade">Factory Upgrade</button>
        <p>Price: <span id="factoryUpgradeCost"></span> creams</p>
    </div>

    <script src="script.js"></script>
</body> 
</body>

</html>
